name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Elixir is tested against the lowest OTP it supports that is
          # also >= our declared OTP floor of 26. Testing 1.18 against a recent
          # OTP would prove nothing about actual 1.18 users. OTP 25 is skipped
          # because precompiled 25 builds are not published for ubuntu-24.04.
          - elixir: "1.18"
            otp: "26"
          - elixir: "1.19"
            otp: "27"
          # Newest pair; this row also runs the lint/type checks.
          - elixir: "1.20"
            otp: "29"
            lint: true
    name: test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    steps:
      - uses: actions/checkout@v4

      # Loose version matching so patch releases are picked up automatically.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      # warnings-as-errors is enforced here, NOT in mix.exs: a future Elixir may
      # add a warning that would otherwise break compilation for every consumer.
      - run: mix compile --warnings-as-errors

      - run: mix test

      # Lint and type checks run only on the newest row. Dialyzer output differs
      # across OTP versions, so running it on every row is noise, not signal.
      - if: matrix.lint
        run: mix format --check-formatted
      - if: matrix.lint
        run: mix deps.unlock --check-unused
      - if: matrix.lint
        run: mix credo --strict
      - if: matrix.lint
        run: mix dialyzer --format github

  # Proto-conformance harness: needs the protoc toolchain, so it is kept as a
  # separate job rather than folded into the matrix. Run on the newest pair.
  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: mix deps.get
      # The protoc-gen-elixir plugin MUST match the pinned `protobuf` lib so the
      # generated oracle modules compile against it. Derive the version from
      # mix.lock rather than floating to latest (which pulls a newer protobuf
      # whose codegen/output differs and breaks the harness).
      - name: Install protoc-gen-elixir matching the pinned protobuf dep
        run: |
          VSN=$(sed -n 's/.*:protobuf, "\([0-9][0-9.]*\)".*/\1/p' mix.lock | head -1)
          echo "Installing protoc-gen-elixir $VSN"
          mix escript.install --force hex protobuf "$VSN"
      - run: echo "$HOME/.mix/escripts" >> $GITHUB_PATH
      - run: mix a2a.gen_proto
      - run: mix test --only proto
  # A2A TCK compliance: runs the official conformance suite against the
  # compliance-server example. Report-only for now — TCK non-compliance keeps
  # the job GREEN (we are not compliant yet and don't want a red ✗ on the PR).
  # The job only turns RED
  # if the harness itself breaks (run_tck.sh exits 2/3/4: TCK missing, server
  # won't boot, never ready) — those are real, actionable failures.
  compliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check out and install the pinned TCK (sibling dir)
        run: |
          # TCK_REF is pinned; keep in sync with docs/tck-compliance.md.
          git clone --depth 1 --branch 1.0.0.alpha2 \
            https://github.com/a2aproject/a2a-tck.git ../a2a-tck
          cd ../a2a-tck && uv venv && uv pip install -e .
      - run: mix deps.get
      - run: mix deps.get
        working-directory: examples/compliance_server
      - name: Run TCK (report-only)
        run: |
          status=0
          scripts/run_tck.sh || status=$?
          case "$status" in
            0) echo "TCK: fully compliant." ;;
            2|3|4) echo "::error::TCK harness failure (exit $status) — see log."; exit "$status" ;;
            *) echo "::warning::TCK reported non-compliance (exit $status) — report-only, not failing the build." ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tck-compliance-report
          path: reports/
